{% extends "base.html" %}
{% block content %}
<div class="flex gap-2 mb-4">
  <a href="{{ url_for('admin.admin_funnels') }}" class="btn bg-zinc-800 hover:bg-zinc-700">Funis</a>
  <a href="{{ url_for('admin.admin_users') }}" class="btn bg-indigo-700 hover:bg-indigo-600">Usuários</a>
</div>

<div class="card">
  <div class="font-semibold mb-3">Usuários</div>
  <div class="space-y-2">
    {% for u in users %}
      <div class="flex items-center justify-between text-sm border-b border-zinc-800 pb-2 last:border-0 last:pb-0">
        <div>
          <div class="font-medium">{{ u.username }} {% if u.is_admin %}<span class="badge bg-indigo-900 text-indigo-300 ml-1">admin</span>{% endif %}</div>
        </div>
        {% if u.id != current_user.id %}
          <form method="post" action="{{ url_for('admin.toggle_ban', user_id=u.id) }}">
            <button class="btn text-xs {{ 'bg-red-900 hover:bg-red-800' if not u.is_banned else 'bg-zinc-800 hover:bg-zinc-700' }}" type="submit">{{ 'banir' if not u.is_banned else 'desbanir' }}</button>
          </form>
        {% endif %}
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
