{% extends "base.html" %}
{% block content %}
<div class="max-w-sm mx-auto mt-16">
  <div class="card">
    <div class="text-xl font-semibold mb-4 text-center">Entrar</div>
    <form method="post" action="{{ url_for('auth.login_post') }}" class="space-y-3">
      <div>
        <label class="text-xs text-zinc-400">Usuário</label>
        <input class="input" type="text" name="username" required autofocus>
      </div>
      <div>
        <label class="text-xs text-zinc-400">Senha</label>
        <input class="input" type="password" name="password" required>
      </div>
      <button class="btn bg-emerald-700 hover:bg-emerald-600 w-full justify-center" type="submit">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
